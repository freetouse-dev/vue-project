      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="tf-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#tf-grad)" />

  <!-- Flow Layers / Kanban Columns -->
  <!-- Back Stack Layer -->
