  <!-- Main Front Card with Task Check -->
  <rect x="14" y="24" width="36" height="26" rx="6" fill="url(#tf-card-grad)" />

  <!-- Task Progress Lines -->
  <rect x="20" y="31" width="16" height="3" rx="1.5" fill="#4338ca" />
  <rect x="20" y="38" width="24" height="3" rx="1.5" fill="#6366f1" fill-opacity="0.5" />
  <rect x="20" y="44" width="10" height="3" rx="1.5" fill="#6366f1" fill-opacity="0.3" />

  <!-- Flow Checkmark Badge -->
  <circle cx="43" cy="24" r="7" fill="#10b981" />
  <path d="M40 24L42 26L46 22" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
